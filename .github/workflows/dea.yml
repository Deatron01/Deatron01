name: Draw Dea

# Draw what Dea is doing right now in her pixel-art home (Budapest time decides day/night,
# bedtime and her routine) and publish it to the dea-output branch, like the snake.
# The renderer and her sprites live on the `dea` branch.
# GitHub runs schedules on a best-effort basis and drops many of them, so this asks for a run
# every 10 minutes to keep the picture close to the real time. Each run replaces the picture
# (no history is kept).

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

concurrency:
  group: draw-dea
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  draw:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dea

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install pillow

      - run: python dea_now.py --assets assets --out dist/dea.webp

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: dea-output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
